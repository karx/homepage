<div class="blogs-container">
    <div class="blogs-header section-header">
        <h2>Writing</h2>
        <p>Notes on building things — hardware, software, and systems.</p>
    </div>
    <div class="blogs-content">
        {% for post in site.posts limit:4 %}
            {% if post.id == page.id %}
                {% continue %}
            {% endif %}
            {% include archive-single.html type="grid" %}
        {% endfor %}
    </div>

    <div class="blogs-more">
        <a href="/blogs/" class="internal-link">All posts &rarr;</a>
    </div>

</div>
