<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Urban Prana Logo (Horizontal Wordmark) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap');
      .wordmark { font-family: 'DM Serif Display', serif; font-size: 24px; fill: currentColor; }
      .lotus-icon { stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>
  
  <!-- Lotus Icon (from icons.svg#icon-lotus, scaled and positioned) -->
  <g transform="translate(5, 5) scale(1.5)" class="lotus-icon">
    <line x1="12" y1="22" x2="12" y2="15"/>
    <path d="M12 15C12 11 9 8 5 9c0 4 3 7 7 6z"/>
    <path d="M12 15C12 11 15 8 19 9c0 4-3 7-7 6z"/>
    <path d="M12 15C10 12 7 12 5 14c1 2 5 3 7 1z"/>
    <path d="M12 15C14 12 17 12 19 14c-1 2-5 3-7 1z"/>
    <path d="M12 9C11.5 6 12 4 12 2c0 2 .5 4 0 7z"/>
  </g>

  <!-- Wordmark -->
  <text x="50" y="32" class="wordmark">Urban Prana</text>
</svg>
