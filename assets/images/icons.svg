<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>

    <!--
      Urban Prana SVG Icon Sprite
      Grid: 24×24  |  Style: stroke-based, 1.5px
      Usage: <svg class="up-icon"><use href="/assets/images/icons.svg#icon-ID"></use></svg>
    -->

    <!-- ── FIVE ELEMENTS ────────────────────────────────────────────────── -->

    <symbol id="icon-prithvi" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Mountain peaks — Prithvi / Earth / Stability -->
      <path d="M2 20L8 8l4 6 3-4 7 10H2z"/>
      <line x1="2" y1="20" x2="22" y2="20"/>
    </symbol>

    <symbol id="icon-jal" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Water drop — Jal / Water / Fluidity -->
      <path d="M12 2C9 7 5 11 5 15.5a7 7 0 0014 0C19 11 15 7 12 2z"/>
    </symbol>

    <symbol id="icon-agni" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Flame — Agni / Fire / Transformation -->
      <path d="M12 22c-4 0-7-3-7-7 0-3 1.5-5.5 4-8.5
               .5 2.5 1.5 4 3 5
               0-3 1-6 3.5-9.5
               1 5 3.5 6.5 3.5 9.5
               0-2-1.5-3-2.5-4
               1 2.5 2.5 4 2.5 6.5
               0 4-3 8-7 8z"/>
    </symbol>

    <symbol id="icon-vayu" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Wind waves — Vayu / Air / Movement -->
      <path d="M3 8h11a2 2 0 000-4H13"/>
      <path d="M3 12h18"/>
      <path d="M3 16h11a2 2 0 010 4H13"/>
    </symbol>

    <symbol id="icon-akasha" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Radiant center — Akasha / Space / Expansion -->
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="2"   x2="12" y2="6"/>
      <line x1="12" y1="18"  x2="12" y2="22"/>
      <line x1="2"  y1="12"  x2="6"  y2="12"/>
      <line x1="18" y1="12"  x2="22" y2="12"/>
      <line x1="5.64" y1="5.64"   x2="8.46" y2="8.46"/>
      <line x1="15.54" y1="15.54" x2="18.36" y2="18.36"/>
      <line x1="18.36" y1="5.64"  x2="15.54" y2="8.46"/>
      <line x1="8.46"  y1="15.54" x2="5.64"  y2="18.36"/>
    </symbol>

    <!-- ── SERVICES ──────────────────────────────────────────────────────── -->

    <symbol id="icon-compass" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Vastu compass — directional orientation -->
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="2"  x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="2"  y1="12" x2="5"  y2="12"/>
      <line x1="19" y1="12" x2="22" y2="12"/>
      <path d="M12 6L10.5 12L12 13.5L13.5 12L12 6z"/>
      <path d="M12 18L10.5 12L12 10.5L13.5 12L12 18z"/>
    </symbol>

    <symbol id="icon-leaf" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Single leaf — Naturopathy / healing -->
      <path d="M11 20A7 7 0 015 13c0-5 6-10 6-10s6 5 6 10a7 7 0 01-6 7z"/>
      <line x1="11" y1="20" x2="11" y2="13"/>
    </symbol>

    <symbol id="icon-sprout" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Seedling — Biophilic design / botanical synergy -->
      <line x1="12" y1="22" x2="12" y2="11"/>
      <path d="M12 11C10 9 7 9 5 11c1 3 5 3 7 0z"/>
      <path d="M12 11C14 9 17 9 19 11c-1 3-5 3-7 0z"/>
    </symbol>

    <symbol id="icon-grid" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- 3×3 Vastu Mandala grid — Geomancy / spatial mapping -->
      <rect x="3" y="3" width="18" height="18" rx="1"/>
      <line x1="9"  y1="3"  x2="9"  y2="21"/>
      <line x1="15" y1="3"  x2="15" y2="21"/>
      <line x1="3"  y1="9"  x2="21" y2="9"/>
      <line x1="3"  y1="15" x2="21" y2="15"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- ── BRAND ──────────────────────────────────────────────────────────── -->

    <symbol id="icon-lotus" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Lotus — Urban Prana brand mark -->
      <line x1="12" y1="22" x2="12" y2="15"/>
      <path d="M12 15C12 11 9 8 5 9c0 4 3 7 7 6z"/>
      <path d="M12 15C12 11 15 8 19 9c0 4-3 7-7 6z"/>
      <path d="M12 15C10 12 7 12 5 14c1 2 5 3 7 1z"/>
      <path d="M12 15C14 12 17 12 19 14c-1 2-5 3-7 1z"/>
      <path d="M12 9C11.5 6 12 4 12 2c0 2 .5 4 0 7z"/>
    </symbol>

    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <!-- Sun — energy, vitality, Agni's cosmic form -->
      <circle cx="12" cy="12" r="5"/>
      <line x1="12"   y1="1"     x2="12"   y2="3"/>
      <line x1="12"   y1="21"    x2="12"   y2="23"/>
      <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1"    y1="12"    x2="3"    y2="12"/>
      <line x1="21"   y1="12"    x2="23"   y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </symbol>

    <!-- ── UI ────────────────────────────────────────────────────────────── -->

    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </symbol>

    <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"/>
      <polyline points="5 12 12 5 19 12"/>
    </symbol>

    <symbol id="icon-envelope" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </symbol>

    <symbol id="icon-location" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </symbol>

    <symbol id="icon-music" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </symbol>

  </defs>
</svg>
